interface:
  display_name: "Design Kit"
  short_description: "Image-first, section-by-section UI art direction"
  default_prompt: "Use $design-kit to explore the UI with section images, starting from my foundation. Iterate with specific prompts and meaningful changes, use the chosen first section to anchor the rest, assemble the page's visual direction from selected images, then stop before actual design or code."
policy:
  allow_implicit_invocation: true
# Preserve selected reference MCP connections; invocation is conditional.
dependencies:
  tools:
    - type: "mcp"
      value: "onepagelove"
      description: "One Page Love reference search when relevant and already available"
      transport: "streamable_http"
      url: "https://api.onepagelove.com/mcp"
    - type: "mcp"
      value: "awwwards"
      description: "Unofficial Awwwards reference server; optional task use and authorized setup in PROVIDERS.md"
