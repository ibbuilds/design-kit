interface:
  display_name: "Design Kit"
  short_description: "Reference-guided image iteration for UI components"
  default_prompt: "Use $design-kit to iterate with images at my requested scale: text, element, component, group, section or page. For multi-part work start with a representative component and consistent visual library, then sections. Reuse selected component images and relevant inspected Awwwards/One Page Love MCP references. After each image round ask what I want next; stop at my chosen milestone before actual design or code."
policy:
  allow_implicit_invocation: true
# Preserve existing visual-reference MCP connections; invocation is conditional.
dependencies:
  tools:
    - type: "mcp"
      value: "onepagelove"
      description: "One Page Love visual references when relevant and already available"
      transport: "streamable_http"
      url: "https://api.onepagelove.com/mcp"
    - type: "mcp"
      value: "awwwards"
      description: "Unofficial Awwwards reference server; conditional use and authorized setup in PROVIDERS.md"
